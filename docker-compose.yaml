services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: task-manager

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_manager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    volumes:
      - ./logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - task-manager-network

  postgres:
    image: postgres:16

    container_name: task-manager-postgres

    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - task-manager-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d task_manager"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - task-manager-network

  prometheus:
    image: prom/prometheus:v2.55.1

    container_name: task-manager-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - task-manager-prometheus-data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    depends_on:
      - app

    networks:
      - task-manager-network

  grafana:
    image: grafana/grafana:11.4.0

    container_name: task-manager-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - task-manager-grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - task-manager-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3

    container_name: task-manager-elasticsearch

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m

    ports:
      - "9200:9200"

    volumes:
      - task-manager-elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    networks:
      - task-manager-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3

    container_name: task-manager-logstash

    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m

    volumes:
      - ./elk/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/usr/share/logstash/app-logs:ro

    depends_on:
      elasticsearch:
        condition: service_healthy

    networks:
      - task-manager-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3

    container_name: task-manager-kibana

    ports:
      - "5601:5601"

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    depends_on:
      elasticsearch:
        condition: service_healthy

    networks:
      - task-manager-network

volumes:
  task-manager-postgres-data:
  task-manager-prometheus-data:
  task-manager-grafana-data:
  task-manager-elasticsearch-data:

networks:
  task-manager-network:
    driver: bridge